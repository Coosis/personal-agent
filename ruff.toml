line-length = 100
target-version = "py313"
extend-exclude = [
  ".direnv",
  ".venv",
  "result",
  "cmd",
  "internal",
  "vendor",
  "sql",
  "scripts",
  "sqlc",
  "stubs",
]

[lint]
select = ["E", "F", "I", "UP", "B"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
